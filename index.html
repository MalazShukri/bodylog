<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12211F">
<title>Body Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13202E;
  --paper:#EDF1F5;
  --surface:#F9FBFD;
  --rule:#CDD5DE;
  --rule-soft:#E0E6ED;
  --teal:#0B8F82;
  --teal-dim:#12A596;
  --muted:#5E6B7A;
  --danger:#C23A3A;
  --c1:#0B9A8C;
  --c2:#D98200;
  --c3:#D9304A;
  --c4:#6B4FE0;
  --c5:#2E9E45;
  --c6:#D1439A;
  --display:"Big Shoulders Display","IBM Plex Sans Arabic",system-ui,sans-serif;
  --on-c:#FFFFFF;
  --r:10px;
  --tap:52px;
  --pad:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --shadow:0 2px 10px rgba(18,33,31,.07),0 1px 2px rgba(18,33,31,.06);
  --shadow-lg:0 -8px 28px rgba(18,33,31,.16);
  --shadow-btn:0 1px 2px rgba(18,33,31,.15);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#EAF1F7;
    --paper:#0F1620;
    --surface:#18222E;
    --rule:#2E3B4B;
    --rule-soft:#212D3B;
    --teal:#3DD6C6;
    --teal-dim:#2BB3A5;
    --muted:#8C9BAD;
    --danger:#FF6B6B;
    --c1:#3DD6C6;
    --c2:#FFB020;
    --c3:#FF4D5E;
    --c4:#9B7BFF;
    --c5:#5BD66B;
    --c6:#FF7AC6;
    --on-c:#0F1620;
    --shadow:0 2px 10px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 -8px 28px rgba(0,0,0,.5);
    --shadow-btn:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
#app{max-width:620px;margin:0 auto;padding-bottom:calc(76px + var(--safe-b))}
.view{display:none}
.view.on{display:block}

/* ---------- mode switch ---------- */
.modebar{
  position:sticky;top:0;z-index:30;
  max-width:620px;margin:0 auto;
  display:flex;gap:6px;
  padding:calc(var(--safe-t) + 10px) var(--pad) 10px;
  background:var(--surface);border-bottom:1px solid var(--rule);
}
.mode{
  flex:1;min-height:38px;border-radius:999px;
  background:var(--paper);color:var(--muted);font-size:13.5px;font-weight:600;letter-spacing:.01em;
  border:1px solid var(--rule-soft);
  transition:background .15s,color .15s,border-color .15s;
}
.mode.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mode:active{opacity:.85}

/* ---------- week strip (the anchor) ---------- */
.week{
  padding:14px var(--pad);
  background:var(--surface);
  border-bottom:1px solid var(--rule);
}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{
  font-size:12px;text-align:center;color:var(--muted);padding:5px 0;border-radius:8px;
  min-height:32px;transition:background .15s,color .15s;
}
.day.today{color:var(--surface);background:var(--ink);font-weight:600}
.day.sel:not(.today){background:var(--rule-soft);color:var(--ink);font-weight:600}
.day b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.day span{display:block;font-size:10.5px;opacity:.75;line-height:1.2}

/* ---------- lists ---------- */
.row{
  display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  min-height:var(--tap);padding:9px var(--pad);
  border-bottom:1px solid var(--rule-soft);
  background:transparent;transition:background .15s;
}
.row:first-of-type{border-top:1px solid var(--rule-soft)}
.row:active{background:var(--surface)}
.row.done{background:color-mix(in srgb,var(--cc,var(--teal)) 9%,transparent)}
.box{
  flex:0 0 auto;width:24px;height:24px;border:1.5px solid var(--rule);border-radius:7px;
  display:grid;place-items:center;background:var(--surface);
  transition:background .15s,border-color .15s,transform .1s;
}
.box:active{transform:scale(.9)}
.box svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.row.done .box{background:var(--cc,var(--teal));border-color:var(--cc,var(--teal))}
.row.pop .box{animation:boxPop .42s cubic-bezier(.2,.9,.3,1.5)}
@keyframes boxPop{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.row.done .box svg{opacity:1;transform:scale(1)}
.row-main{flex:1;min-width:0}
.row-name{font-size:15.5px;line-height:1.3;word-break:break-word}
.row.done .row-name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- today: hero + ring ---------- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px var(--pad) 4px}
.hero-day{font-family:var(--display);font-weight:800;font-size:48px;line-height:.9;letter-spacing:.005em}
.hero-sub{margin-top:8px;font-size:14px;color:var(--muted)}
.ring{position:relative;width:96px;height:96px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:9}
.ring .seg{stroke:var(--rule-soft)}
.ring .seg.done{stroke:var(--cc)}
.ring.draw .seg{animation:segIn .55s both cubic-bezier(.2,.7,.3,1)}
@keyframes segIn{from{opacity:0;stroke-width:0}to{opacity:1;stroke-width:9}}
.ring .seg.pop{animation:segPop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes segPop{0%{stroke-width:9}40%{stroke-width:15}100%{stroke-width:9}}
.ring-num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-num b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.ring-num small{font-size:11px;color:var(--muted)}

/* ---------- today: category sections ---------- */
.cat{position:relative;margin:18px var(--pad) 0;border-radius:18px;background:var(--surface);border:1px solid var(--rule-soft);overflow:hidden}
.cat::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--cc)}
.cat-head{display:flex;align-items:center;gap:12px;padding:12px 14px 10px 18px}
.cat-icon{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,transparent)}
.cat-icon svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cat-name{flex:1;min-width:0;font-weight:600;font-size:15px}
.cat-count{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.cat.full .cat-count{color:var(--cc)}
.cat.flash{animation:catFlash .9s ease-out}
@keyframes catFlash{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--cc) 55%,transparent)}to{box-shadow:0 0 0 16px transparent}}
.cat .row{padding-inline-start:18px}
.cat .row:last-child{border-bottom:0}
.dose{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule-soft);font-size:13px;font-weight:600;white-space:nowrap;direction:ltr}
.dose svg{width:14px;height:14px;fill:none;stroke:var(--cc,currentColor);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.done .dose{opacity:.5}
.confetti{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:70}

/* ---------- misc ---------- */
.empty-state{padding:44px var(--pad);text-align:center;color:var(--muted);font-size:14.5px}
.empty-state p{margin:0 0 16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 20px;border-radius:var(--r);
  background:var(--ink);color:var(--surface);font-size:15px;font-weight:500;
  box-shadow:var(--shadow-btn);transition:transform .1s,opacity .15s;
}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.btn.wide{width:100%}
.btn:active{opacity:.8;transform:scale(.98)}

.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding:22px var(--pad) 0;
}
.page-head h1{font-family:var(--display);font-weight:800;font-size:48px;line-height:.9;margin:0;letter-spacing:.005em}
.page-sub{padding:8px var(--pad) 0;font-size:14px;color:var(--muted)}
.link{font-size:14px;color:var(--teal);font-weight:500}
.pill{
  display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;
  background:var(--surface);border:1px solid var(--rule-soft);font-size:13.5px;font-weight:600;color:var(--ink);
  transition:transform .1s;
}
.pill:active{transform:scale(.96)}
.pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--cc,var(--ink));color:var(--on-c);font-weight:600}
.btn.add{border-radius:18px;min-height:54px;font-weight:600}
.btn.add svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

.filterbar{display:flex;gap:8px;padding:16px var(--pad) 2px;overflow-x:auto}
.filterbar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:34px;padding:0 14px;border-radius:999px;
  background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;
  border:1px solid var(--rule-soft);white-space:nowrap;transition:background .15s,color .15s;
}
.chip.on{background:var(--teal);color:var(--on-c);border-color:var(--teal)}

/* ---------- library rows ---------- */
.cat-edit{flex:0 0 auto;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--paper)}
.cat-edit svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cat-note{padding:0 18px 16px;font-size:13px;color:var(--muted)}
.lib-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted)}
.daydots{display:inline-flex;gap:3px;direction:ltr}
.daydots i{font-style:normal;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);background:var(--paper)}
.daydots i.on{background:var(--cc);color:var(--on-c)}

/* ---------- tabbar ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;
  background:var(--surface);
  box-shadow:var(--shadow-lg);
  padding-bottom:var(--safe-b);
}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:11.5px;transition:color .15s}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--ink);font-weight:600}
.tab.on::before{content:"";position:absolute;top:1px;width:26px;height:3px;border-radius:2px;background:var(--ink)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,10,16,.55);z-index:50;display:none}
.scrim.on{display:block;animation:fadeIn .22s ease-out}
@keyframes fadeIn{from{opacity:0}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  max-width:620px;margin:0 auto;max-height:92vh;overflow-y:auto;
  background:var(--paper);border-radius:24px 24px 0 0;
  box-shadow:var(--shadow-lg);
  padding:8px var(--pad) calc(24px + var(--safe-b));
  display:none;
}
.sheet::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:var(--cc,transparent);border-radius:24px 24px 0 0}
.sheet.on{display:block;animation:sheetUp .34s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetUp{from{transform:translateY(48px);opacity:0}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 14px}
.sheet-head{display:flex;align-items:center;gap:14px;margin:4px 0 22px}
.sheet-head .cat-icon{width:54px;height:54px;border-radius:17px;transition:background .2s,color .2s}
.sheet-head .cat-icon svg{width:36px;height:36px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:.95;margin:0}
.field{margin-bottom:18px}
.field label,.field-label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.field input[type=text],.field select,.field textarea{
  width:100%;min-height:48px;padding:10px 14px;
  border:1px solid var(--rule);border-radius:14px;background:var(--surface);
  transition:border-color .15s,box-shadow .15s;
}
.field input[type=text]:focus{outline:none;border-color:var(--cc,var(--teal));box-shadow:0 0 0 3px color-mix(in srgb,var(--cc,var(--teal)) 25%,transparent)}
.field textarea{min-height:64px;resize:vertical}
.field-hint{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.4}
.optpick{display:flex;flex-wrap:wrap;gap:8px}
.opt{
  display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;
  border:1px solid var(--rule);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted);
  transition:background .15s,color .15s,border-color .15s,transform .1s;
}
.opt:active{transform:scale(.95)}
.opt svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.opt.on{background:var(--oc,var(--cc,var(--ink)));border-color:var(--oc,var(--cc,var(--ink)));color:var(--on-c)}
.opt.add{border-style:dashed}
.opt.add svg{width:14px;height:14px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{
  min-height:46px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);
  font-size:13px;font-weight:600;color:var(--muted);transition:background .15s,color .15s,transform .1s;
}
.daypick button:active{transform:scale(.92)}
.daypick button.on{background:var(--cc,var(--ink));color:var(--on-c);border-color:var(--cc,var(--ink))}
.checkline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border:1px solid var(--rule-soft);border-radius:16px;background:var(--surface)}
.checkline label{margin:0;font-size:14.5px;color:var(--ink);font-weight:500}
.switch{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:48px;height:28px;margin:0;border-radius:999px;background:var(--rule);position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.2,.8,.3,1.3)}
.switch:checked{background:var(--cc,var(--teal))}
.switch:checked::after{transform:translateX(20px)}
.sheet-actions{display:flex;gap:10px;margin-top:24px}
.sheet-actions .btn{flex:1;border-radius:14px;min-height:50px}
.sheet .btn.danger{border-radius:14px}

/* ---------- day-feed progress ---------- */
.pday-head{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px 10px 18px}
.pday-title{flex:1;min-width:0}
.pday-name{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.pday-date{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.pday-count{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.pday.all .pday-count{color:var(--teal)}
.segbar{display:flex;gap:3px;padding:0 16px 14px 18px}
.segbar i{flex:1;height:6px;border-radius:3px;background:var(--rule-soft)}
.segbar i.done{background:var(--cc)}
.dayitem{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px 11px 18px;border-top:1px solid var(--rule-soft);font-size:14.5px;
}
.dayitem-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--cc,var(--teal))}
.dayitem-name{flex:1;min-width:0;word-break:break-word}
.dayitem-mark{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center}
.dayitem-mark svg{width:12px;height:12px}
.dayitem.done .dayitem-name{color:var(--muted)}
.dayitem.done .dayitem-mark{background:var(--cc,var(--teal));border-color:var(--cc,var(--teal))}


.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));z-index:60;
  background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:22px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="modebar" id="modebar">
  <button class="mode on" data-mode="workout">Workout</button>
  <button class="mode" data-mode="tasks">Tasks</button>
</div>

<div id="app">

  <!-- TODAY -->
  <section class="view on" id="v-today">
    <div class="week">
      <div class="days" id="daysRow"></div>
    </div>
    <div id="todayList"></div>
  </section>

  <!-- LIBRARY -->
  <section class="view" id="v-lib">
    <div class="page-head">
      <h1>Library</h1>
      <button class="pill" id="addCatBtn"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>Category</button>
    </div>
    <div class="page-sub" id="libSub"></div>
    <div class="filterbar" id="libFilterBar"></div>
    <div id="libList"></div>
    <div style="padding:22px var(--pad) 8px">
      <button class="btn wide add" id="addExBtn"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>Add exercise</button>
    </div>
  </section>

  <!-- WORKOUT PROGRESS -->
  <section class="view" id="v-wprog">
    <div class="page-head">
      <h1>Progress</h1>
      <button class="pill" id="dataBtn"><svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg>Backup</button>
    </div>
    <div class="page-sub">Last 84 days. Tap a day to open it.</div>
    <div id="wprogBody"></div>
  </section>

  <!-- TASKS -->
  <section class="view" id="v-tasks">
    <div class="page-head">
      <h1>Tasks</h1>
    </div>
    <div class="page-sub" id="taskSub"></div>
    <div id="taskList"></div>
    <div style="padding:22px var(--pad) 8px">
      <button class="btn wide add" id="addTaskBtn"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>Add task</button>
    </div>
  </section>

  <!-- TASK PROGRESS -->
  <section class="view" id="v-tprog">
    <div class="page-head">
      <h1>Progress</h1>
      <button class="pill" id="dataBtn2"><svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg>Backup</button>
    </div>
    <div class="page-sub">Last 84 days.</div>
    <div id="tprogBody"></div>
  </section>

</div>

<nav class="tabs" id="tabs-workout" style="grid-template-columns:repeat(3,1fr)">
  <button class="tab on" data-view="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8.5 14.5l2.2 2.2 4.3-4.6"/></svg>
    Today
  </button>
  <button class="tab" data-view="lib">

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ storage ============ */
const KEY = "bodylog.v1";
const DAY_ABBR = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const HISTORY_DAYS = 84;
const DEFAULT_MUSCLES = ["Neck","Chest","Shoulders","Biceps/Triceps","Forearms","Hands & wrists","Fingers","Abs","Hips","Legs","Knees"];

const uid = () => Math.random().toString(36).slice(2, 9);

function iso(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function sundayOf(date){
  const x = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  x.setDate(x.getDate() - x.getDay());
  return iso(x);
}
function addDays(isoStr, n){ const d = parseISO(isoStr); d.setDate(d.getDate()+n); return iso(d); }
function weekDates(ws){ return Array.from({length:7}, (_,i) => addDays(ws, i)); }
function fmtShort(isoStr){ const d = parseISO(isoStr); return d.getDate()+" "+MONTHS[d.getMonth()]; }

function defaultState(){
  const ws = sundayOf(new Date());
  return {
    v: 2,
    weekStart: ws,
    categories: [
      { id: uid(), name: "Stretching & Mobility" },
      { id: uid(), name: "Posture" },
      { id: uid(), name: "Calisthenics" },
      { id: uid(), name: "Grip & Forearms" },
      { id: uid(), name: "Punching Power" }
    ],
    exercises: [],
    log: {},
    tasks: [],
    taskLog: {},
    muscles: DEFAULT_MUSCLES.slice()
  };
}

let state;
let selectedDate = iso(new Date());
let mode = "workout";
let libFilter = "";

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  } catch(e){ state = defaultState(); }
  if(!state || !state.categories) state = defaultState();
  state.exercises = state.exercises || [];
  state.log = state.log || {};
  state.tasks = state.tasks || [];
  state.taskLog = state.taskLog || {};
  state.muscles = (state.muscles && state.muscles.length) ? state.muscles : DEFAULT_MUSCLES.slice();
  delete state.history;
  delete state.pbs;
  rollover();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("Storage full — export a backup"); }
}

/* ============ rollover / retention ============ */
function pruneOld(){
  const cutoff = addDays(iso(new Date()), -HISTORY_DAYS);
  let dirty = false;
  Object.keys(state.log).forEach(d => { if(d < cutoff){ delete state.log[d]; dirty = true; } });
  Object.keys(state.taskLog).forEach(d => { if(d < cutoff){ delete state.taskLog[d]; dirty = true; } });
  const keptTasks = state.tasks.filter(t => t.pinned || t.date >= cutoff);
  if(keptTasks.length !== state.tasks.length) dirty = true;
  state.tasks = keptTasks;
  return dirty;
}
function rollover(){
  const cur = sundayOf(new Date());
  let dirty = state.weekStart !== cur;
  state.weekStart = cur;
  if(pruneOld()) dirty = true;
  if(dirty) save();
}

/* ============ scheduling ============ */
function scheduledOn(dateStr){
  const dow = parseISO(dateStr).getDay();
  return state.exercises.filter(ex => ex.days.includes(dow));
}
function dayStats(dateStr){
  const list = scheduledOn(dateStr);
  const day = state.log[dateStr] || {};
  const done = list.filter(ex => day[ex.id] && day[ex.id].done).length;
  return { done, total: list.length };
}
function tasksOn(dateStr){
  return state.tasks.filter(t => t.pinned ? t.date <= dateStr : t.date === dateStr);
}

/* ============ helpers ============ */
function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined && text !== null) n.textContent = text;
  return n;
}
function bidi(node, text){
  node.textContent = text;
  node.setAttribute("dir","auto");
  node.style.textAlign = "start";
  return node;
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2000);
}

/* ============ TODAY ============ */
function renderWeek(){
  const ws = state.weekStart;
  const daysRow = document.getElementById("daysRow");
  daysRow.innerHTML = "";
  const todayStr = iso(new Date());

  weekDates(ws).forEach((d, i) => {
    const btn = el("button","day" + (d===todayStr ? " today" : "") + (d===selectedDate ? " sel" : ""));
    const b = el("b", null, DAY_ABBR[i][0]);
    const sp = el("span", null, String(parseISO(d).getDate()));
    btn.appendChild(b); btn.appendChild(sp);
    btn.setAttribute("aria-label", DAY_ABBR[i] + " " + fmtShort(d));
    btn.onclick = () => { selectedDate = d; renderToday(); };
    daysRow.appendChild(btn);
  });
}

const DAY_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const CAT_ICONS = {
  stretch:'<svg viewBox="0 0 40 40"><circle cx="16" cy="7" r="3.4"/><path d="M17 11c2.5 5 2.5 10 0 15"/><path d="M17.5 14c5-2 9-6 11-11"/><path d="M17 16c-3 1.5-6 2-9 1.5"/><path d="M17 26l-5 10M17 26l7 9"/></svg>',
  pull:'<svg viewBox="0 0 40 40"><path d="M4 5h32"/><path d="M12 5l4 10M28 5l-4 10"/><circle cx="20" cy="12" r="3.2"/><path d="M16 15h8M20 15v12M20 27l-4 9M20 27l4 9"/></svg>',
  fist:'<svg viewBox="0 0 40 40"><path d="M14 15v-2a3 3 0 0 1 6 0v1a3 3 0 0 1 6 0v1a3 3 0 0 1 6 0v9c0 6-4.5 10-10.5 10H20c-5.5 0-9-4-9-9v-6a3 3 0 0 1 3-3z"/><path d="M14 21c2.5-1.2 5.5-1 7.5 1.5"/><path d="M3 17h5M2 23h6M3 29h5"/></svg>',
  other:'<svg viewBox="0 0 40 40"><path d="M9 14v12M13 11v18M27 11v18M31 14v12M13 20h14"/></svg>'
};
const CLOCK_SVG = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>';
const REPS_SVG = '<svg viewBox="0 0 16 16"><path d="M3 6.5A5 5 0 0 1 12.5 5M13 9.5A5 5 0 0 1 3.5 11"/><path d="M12.5 2v3h-3M3.5 14v-3h3"/></svg>';

const UI_ICONS = {
  pin:'<svg viewBox="0 0 40 40"><path d="M15 6h10l-2 10 6 6H11l6-6z"/><path d="M20 22v12"/></svg>',
  sun:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="6"/><path d="M20 5v5M20 30v5M5 20h5M30 20h5M9.4 9.4l3.5 3.5M27.1 27.1l3.5 3.5M9.4 30.6l3.5-3.5M27.1 12.9l3.5-3.5"/></svg>',
  data:'<svg viewBox="0 0 40 40"><ellipse cx="20" cy="10" rx="12" ry="4.5"/><path d="M8 10v20c0 2.5 5.4 4.5 12 4.5s12-2 12-4.5V10M8 20c0 2.5 5.4 4.5 12 4.5s12-2 12-4.5"/></svg>',
  plus:'<svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>',
  pencil:'<svg viewBox="0 0 20 20"><path d="M4 16l1-4 8-8 3 3-8 8z"/><path d="M11 6l3 3"/></svg>'
};

function styleFor(name, idx){
  const n = (name || "").toLowerCase();
  if(/stretch|posture|mobil/.test(n)) return { color:"var(--c1)", icon:CAT_ICONS.stretch };
  if(/calisth|strength|push|pull/.test(n)) return { color:"var(--c2)", icon:CAT_ICONS.pull };
  if(/punch|grip|forearm|box/.test(n)) return { color:"var(--c3)", icon:CAT_ICONS.fist };
  return { color:["var(--c4)","var(--c5)","var(--c6)"][Math.max(0, idx) % 3], icon:CAT_ICONS.other };
}
function catStyle(cat){
  return styleFor(cat && cat.name, state.categories.indexOf(cat));
}
function catOfId(id){ return state.categories.find(c => c.id === id); }
function byCategoryOrder(list){
  const idx = id => state.categories.findIndex(c => c.id === id);
  return list.slice().sort((a, b) => idx(a.cat) - idx(b.cat));
}

function catCard(color, icon, title, countText, extra){
  const sec = el("section","cat");
  sec.style.setProperty("--cc", color);
  const head = el("div","cat-head");
  const ic = el("span","cat-icon");
  ic.innerHTML = icon;
  ic.setAttribute("aria-hidden","true");
  const nm = el("span","cat-name");
  bidi(nm, title);
  head.appendChild(ic); head.appendChild(nm);
  if(countText !== null) head.appendChild(el("span","cat-count", countText));
  if(extra) head.appendChild(extra);
  sec.appendChild(head);
  return sec;
}

function dayDots(days){
  const w = el("span","daydots");
  w.setAttribute("aria-label", days.length ? days.map(d => DAY_ABBR[d]).join(", ") : "Not scheduled");
  DAY_ABBR.forEach((d, i) => w.appendChild(el("i", days.includes(i) ? "on" : "", d[0])));
  return w;
}

function sheetHead(body, title, icon){
  const h = el("div","sheet-head");
  const ic = el("span","cat-icon");
  ic.innerHTML = icon;
  ic.setAttribute("aria-hidden","true");
  h.appendChild(ic);
  h.appendChild(el("h2", null, title));
  body.appendChild(h);
  return {
    setLook(color, icon2){
      document.getElementById("sheet").style.setProperty("--cc", color);
      ic.innerHTML = icon2;
    }
  };
}

function optPicker(getItems, selected, onPick, extra){
  const wrap = el("div","optpick");
  let sel = selected;
  const render = () => {
    wrap.innerHTML = "";
    getItems().forEach(it => {
      const on = it.value === sel;
      const b = el("button","opt" + (on ? " on" : ""));
      b.type = "button";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if(it.color) b.style.setProperty("--oc", it.color);
      if(it.icon) b.insertAdjacentHTML("beforeend", it.icon);
      const s = el("span");
      bidi(s, it.label);
      b.appendChild(s);
      b.onclick = () => { sel = (on && it.toggle) ? "" : it.value; onPick(sel); render(); };
      wrap.appendChild(b);
    });
    if(extra) wrap.appendChild(extra);
  };
  render();
  return { el:wrap, set(v){ sel = v; render(); } };
}

function doseChip(dose){
  const t = String(dose).trim();
  const timed = /\d\s*(s|sec|secs|m|min|mins)\b/i.test(t);
  const c = el("span","dose");
  c.innerHTML = timed ? CLOCK_SVG : REPS_SVG;
  c.appendChild(document.createTextNode(t.replace(/\s*[*×]\s*|\s+x\s+/gi, " × ")));
  c.setAttribute("aria-label", (timed ? "Time " : "Reps ") + t);
  return c;
}

let lastToggled = null;
let ringDrawnFor = null;

function buildRing(ordered, isDone, done){
  const ns = "http://www.w3.org/2000/svg";
  const n = ordered.length, R = 38, C = 2 * Math.PI * R, seg = C / n;
  const gap = n > 1 ? Math.min(3, seg * .25) : 0;
  const draw = ringDrawnFor !== selectedDate;
  ringDrawnFor = selectedDate;
  const ring = el("div","ring" + (draw ? " draw" : ""));
  ring.setAttribute("role","img");
  ring.setAttribute("aria-label", done + " of " + n + " done");
  const svg = document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 96 96");
  ordered.forEach((o, i) => {
    const c = document.createElementNS(ns,"circle");
    c.setAttribute("cx","48"); c.setAttribute("cy","48"); c.setAttribute("r", String(R));
    c.setAttribute("stroke-dasharray", (seg - gap) + " " + (C - seg + gap));
    c.setAttribute("stroke-dashoffset", String(-i * seg));
    c.setAttribute("class", "seg" + (isDone(o.ex) ? " done" : "") + (o.ex.id === lastToggled ? " pop" : ""));
    c.style.setProperty("--cc", o.style.color);
    if(draw) c.style.animationDelay = (i * 30) + "ms";
    svg.appendChild(c);
  });
  ring.appendChild(svg);
  const num = el("div","ring-num");
  num.appendChild(el("b", null, String(done)));
  num.appendChild(el("small", null, "of " + n));
  ring.appendChild(num);
  return ring;
}

function celebrate(colors){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ring = document.querySelector("#todayList .ring");
  if(!ring || !ring.animate) return;
  const r = ring.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for(let i = 0; i < 40; i++){
    const p = el("span","confetti");
    p.style.background = colors[i % colors.length];
    p.style.left = cx + "px"; p.style.top = cy + "px";
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 120;
    const dx = Math.cos(a) * dist, dy = Math.sin(a) * dist + 80;
    p.animate([
      { transform:"translate(-50%,-50%) rotate(0deg)", opacity:1 },
      { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${Math.random() * 720 - 360}deg)`, opacity:0 }
    ], { duration:1000 + Math.random() * 600, easing:"cubic-bezier(.15,.6,.35,1)" }).onfinish = () => p.remove();
  }
}

function renderToday(){
  renderWeek();
  const wrap = document.getElementById("todayList");
  wrap.innerHTML = "";

  const d = parseISO(selectedDate);
  const isToday = selectedDate === iso(new Date());
  const list = scheduledOn(selectedDate);
  const day = state.log[selectedDate] || {};
  const isDone = ex => !!(day[ex.id] && day[ex.id].done);

  const groups = state.categories
    .map(cat => ({ cat, style:catStyle(cat), items:list.filter(ex => ex.cat === cat.id) }))
    .filter(g => g.items.length);
  const ordered = [];
  groups.forEach(g => g.items.forEach(ex => ordered.push({ ex, style:g.style })));
  const done = ordered.filter(o => isDone(o.ex)).length;

  const hero = el("div","hero");
  const txt = el("div");
  txt.appendChild(el("div","hero-day", DAY_FULL[d.getDay()]));
  txt.appendChild(el("div","hero-sub", (isToday ? "Today, " : "") + fmtShort(selectedDate)));
  hero.appendChild(txt);
  if(ordered.length) hero.appendChild(buildRing(ordered, isDone, done));
  wrap.appendChild(hero);

  if(!list.length){
    lastToggled = null;
    const e = el("div","empty-state");
    const p = el("p", null, state.exercises.length
      ? "Nothing scheduled for this day."
      : "No exercises yet. Add your own in Library.");
    const b = el("button","btn ghost", state.exercises.length ? "Open Library" : "Add first exercise");
    b.onclick = () => { switchView("lib"); if(!state.exercises.length) openExSheet(null); };
    e.appendChild(p); e.appendChild(b);
    wrap.appendChild(e);
    return;
  }

  groups.forEach(g => {
    const doneN = g.items.filter(isDone).length;
    const full = doneN === g.items.length;
    const justFilled = full && g.items.some(ex => ex.id === lastToggled);
    const sec = el("section","cat" + (full ? " full" : "") + (justFilled ? " flash" : ""));
    sec.style.setProperty("--cc", g.style.color);
    const head = el("div","cat-head");
    const ic = el("span","cat-icon");
    ic.innerHTML = g.style.icon;
    ic.setAttribute("aria-hidden","true");
    const nm = el("span","cat-name");
    bidi(nm, g.cat.name);
    head.appendChild(ic); head.appendChild(nm); head.appendChild(el("span","cat-count", doneN + "/" + g.items.length));
    sec.appendChild(head);
    g.items.forEach(ex => sec.appendChild(exRow(ex)));
    wrap.appendChild(sec);
  });

  const finishedNow = lastToggled && done === ordered.length && ordered.some(o => o.ex.id === lastToggled);
  lastToggled = null;
  if(finishedNow){
    celebrate(groups.map(g => g.style.color));
    toast("Day complete");
  }
}

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#F6F8F3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';

function exRow(ex){
  const day = state.log[selectedDate] || {};
  const entry = day[ex.id] || {};
  const row = el("div","row" + (entry.done ? " done" : "") + (entry.done && ex.id === lastToggled ? " pop" : ""));
  row.setAttribute("role","button");
  row.tabIndex = 0;

  const box = el("div","box");
  box.innerHTML = CHECK_SVG;
  row.appendChild(box);

  const main = el("div","row-main");
  const name = el("div","row-name");
  bidi(name, ex.name);
  main.appendChild(name);
  row.appendChild(main);
  if(ex.dose) row.appendChild(doseChip(ex.dose));

  const toggle = () => {
    const nowDone = !(state.log[selectedDate] && state.log[selectedDate][ex.id] && state.log[selectedDate][ex.id].done);
    setEntry(ex.id, { done: nowDone });
    lastToggled = nowDone ? ex.id : null;
    renderToday();
  };
  row.onclick = toggle;
  row.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } };
  return row;
}

function setEntry(exId, patch){
  if(!state.log[selectedDate]) state.log[selectedDate] = {};
  const cur = state.log[selectedDate][exId] || { done:false, val:null };
  state.log[selectedDate][exId] = Object.assign(cur, patch);
  save();
}

/* ============ LIBRARY ============ */
function renderLibFilter(){
  const bar = document.getElementById("libFilterBar");
  const used = state.muscles.filter(m => state.exercises.some(ex => ex.target === m));
  if(libFilter && !used.includes(libFilter)) libFilter = "";
  bar.innerHTML = "";
  if(!used.length){ bar.style.display = "none"; return; }
  bar.style.display = "flex";
  const allChip = el("button","chip" + (libFilter === "" ? " on" : ""), "All");
  allChip.onclick = () => { libFilter = ""; renderLib(); };
  bar.appendChild(allChip);
  used.forEach(m => {
    const c = el("button","chip" + (libFilter === m ? " on" : ""), m);
    c.onclick = () => { libFilter = (libFilter === m ? "" : m); renderLib(); };
    bar.appendChild(c);
  });
}

function renderLib(){
  renderLibFilter();
  const wrap = document.getElementById("libList");
  wrap.innerHTML = "";
  const nEx = state.exercises.length, nCat = state.categories.length;
  document.getElementById("libSub").textContent =
    nEx + (nEx === 1 ? " exercise" : " exercises") + " in " + nCat + (nCat === 1 ? " category" : " categories");
  if(!nEx && !nCat){
    const e = el("div","empty-state");
    e.appendChild(el("p", null, "Your library is empty. Add a category first, then your exercises."));
    wrap.appendChild(e);
    return;
  }
  let shown = 0;
  state.categories.forEach(cat => {
    const all = state.exercises.filter(ex => ex.cat === cat.id);
    const items = libFilter ? all.filter(ex => ex.target === libFilter) : all;
    if(libFilter && !items.length) return;
    shown += items.length;

    const edit = el("button","cat-edit");
    edit.innerHTML = UI_ICONS.pencil;
    edit.setAttribute("aria-label","Edit category " + cat.name);
    edit.onclick = () => openCatSheet(cat);
    const s = catStyle(cat);
    const sec = catCard(s.color, s.icon, cat.name, String(items.length), edit);

    if(!items.length) sec.appendChild(el("div","cat-note","No exercises here yet."));
    items.forEach(ex => {
      const row = el("div","row");
      row.setAttribute("role","button");
      row.tabIndex = 0;
      const main = el("div","row-main");
      const n = el("div","row-name");
      bidi(n, ex.name);
      main.appendChild(n);
      const meta = el("div","lib-meta");
      meta.appendChild(dayDots(ex.days));
      if(ex.target) meta.appendChild(el("span", null, ex.target));
      main.appendChild(meta);
      row.appendChild(main);
      if(ex.dose) row.appendChild(doseChip(ex.dose));
      const open = () => openExSheet(ex);
      row.onclick = open;
      row.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); open(); } };
      sec.appendChild(row);
    });
    wrap.appendChild(sec);
  });
  if(libFilter && !shown){
    wrap.appendChild(el("div","empty-state","No exercises target " + libFilter + " yet."));
  }
}

/* ============ sheets ============ */
function openSheet(build, color){
  const sheet = document.getElementById("sheet");
  if(color) sheet.style.setProperty("--cc", color); else sheet.style.removeProperty("--cc");
  sheet.scrollTop = 0;
  const body = document.getElementById("sheetBody");
  body.innerHTML = "";
  build(body);
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
document.getElementById("scrim").onclick = closeSheet;

function makeField(labelText, node){
  const f = el("div","field");
  const l = el("label", null, labelText);
  f.appendChild(l); f.appendChild(node);
  return f;
}
function textInput(value, placeholder){
  const i = document.createElement("input");
  i.type = "text";
  i.value = value || "";
  if(placeholder) i.placeholder = placeholder;
  i.setAttribute("dir","auto");
  i.style.textAlign = "start";
  return i;
}

function openExSheet(ex){
  const editing = !!ex;
  const draft = editing
    ? JSON.parse(JSON.stringify(ex))
    : { id: uid(), cat: state.categories[0] ? state.categories[0].id : null, name:"", target:"", dose:"", days:[] };

  const look = () => catStyle(catOfId(draft.cat));

  openSheet(body => {
    const head = sheetHead(body, editing ? "Edit exercise" : "New exercise", look().icon);

    const nameI = textInput(draft.name, "Exercise name — English or العربية");
    body.appendChild(makeField("Name", nameI));

    const catPick = optPicker(
      () => state.categories.map(c => { const s = catStyle(c); return { value:c.id, label:c.name, color:s.color, icon:s.icon }; }),
      draft.cat,
      v => { draft.cat = v; const s = look(); head.setLook(s.color, s.icon); }
    );
    const catF = el("div","field");
    catF.appendChild(el("span","field-label","Category"));
    catF.appendChild(catPick.el);
    body.appendChild(catF);

    const doseI = textInput(draft.dose, "3 × 12   or   30s");
    body.appendChild(makeField("Sets / reps / time", doseI));

    const addChip = el("button","opt add");
    addChip.type = "button";
    addChip.innerHTML = UI_ICONS.plus;
    addChip.appendChild(el("span", null, "New"));
    const targetPick = optPicker(
      () => state.muscles.map(m => ({ value:m, label:m, toggle:true })),
      draft.target,
      v => { draft.target = v; },
      addChip
    );
    const targetF = el("div","field");
    targetF.appendChild(el("span","field-label","What it targets (optional)"));
    targetF.appendChild(targetPick.el);

    const newRow = el("div","two");
    newRow.hidden = true;
    newRow.style.marginTop = "10px";
    const newI = textInput("", "e.g. Calves");
    const newAdd = el("button","btn ghost","Add");
    newAdd.type = "button";
    newRow.appendChild(newI);
    newRow.appendChild(newAdd);
    targetF.appendChild(newRow);

    addChip.onclick = () => {
      newRow.hidden = !newRow.hidden;
      if(!newRow.hidden) setTimeout(() => newI.focus(), 30);
    };
    const commitNewTarget = () => {
      const name = newI.value.trim();
      if(!name) return;
      const existing = state.muscles.find(m => m.toLowerCase() === name.toLowerCase());
      if(!existing){
        state.muscles.push(name);
        save();
      }
      draft.target = existing || name;
      targetPick.set(draft.target);
      newI.value = "";
      newRow.hidden = true;
      toast(existing ? "Already in the list" : "Added");
    };
    newAdd.onclick = commitNewTarget;
    newI.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); commitNewTarget(); } };

    body.appendChild(targetF);

    const dp = el("div","daypick");
    DAY_ABBR.forEach((d, i) => {
      const b = el("button", draft.days.includes(i) ? "on" : "", d[0]);
      b.type = "button";
      b.setAttribute("aria-label", d);
      b.onclick = () => {
        const k = draft.days.indexOf(i);
        if(k >= 0) draft.days.splice(k,1); else draft.days.push(i);
        b.className = draft.days.includes(i) ? "on" : "";
      };
      dp.appendChild(b);
    });
    body.appendChild(makeField("Days", dp));

    const acts = el("div","sheet-actions");
    const cancel = el("button","btn ghost","Cancel");
    cancel.onclick = closeSheet;
    const savB = el("button","btn primary", editing ? "Save changes" : "Add exercise");
    savB.onclick = () => {
      const name = nameI.value.trim();
      if(!name){ toast("Give the exercise a name"); nameI.focus(); return; }
      if(!draft.cat){ toast("Add a category first"); return; }
      if(!draft.days.length){ toast("Pick at least one day"); return; }
      const rec = {
        id: draft.id, cat: draft.cat, name: name,
        target: draft.target || "", dose: doseI.value.trim(),
        days: draft.days.slice().sort()
      };
      const idx = state.exercises.findIndex(e => e.id === rec.id);
      if(idx >= 0) state.exercises[idx] = rec; else state.exercises.push(rec);
      save(); closeSheet(); renderLib(); renderToday();
      toast(editing ? "Saved" : "Added");
    };
    acts.appendChild(cancel); acts.appendChild(savB);
    body.appendChild(acts);

    if(editing){
      const del = el("button","btn danger wide","Delete exercise");
      del.style.marginTop = "10px";
      del.onclick = () => {
        if(!confirm("Delete this exercise? Its logs are removed too.")) return;
        state.exercises = state.exercises.filter(e => e.id !== ex.id);
        Object.keys(state.log).forEach(d => { if(state.log[d]) delete state.log[d][ex.id]; });
        save(); closeSheet(); renderLib(); renderToday(); renderWProg();
        toast("Deleted");
      };
      body.appendChild(del);
    }
    setTimeout(() => nameI.focus(), 60);
  }, look().color);
}

function openCatSheet(cat){
  const editing = !!cat;
  const idx = editing ? state.categories.indexOf(cat) : state.categories.length;
  const start = styleFor(editing ? cat.name : "", idx);
  openSheet(body => {
    const head = sheetHead(body, editing ? "Edit category" : "New category", start.icon);
    const nameI = textInput(editing ? cat.name : "", "Category name — English or العربية");
    const nameF = makeField("Name", nameI);
    nameF.appendChild(el("div","field-hint","The icon and color follow the name. Try words like stretch, posture, calisthenics, grip or punch."));
    body.appendChild(nameF);
    nameI.oninput = () => { const s = styleFor(nameI.value, idx); head.setLook(s.color, s.icon); };

    const acts = el("div","sheet-actions");
    const cancel = el("button","btn ghost","Cancel");
    cancel.onclick = closeSheet;
    const savB = el("button","btn primary", editing ? "Save changes" : "Add category");
    savB.onclick = () => {
      const name = nameI.value.trim();
      if(!name){ toast("Give the category a name"); nameI.focus(); return; }
      if(editing){
        const c = state.categories.find(c => c.id === cat.id);
        c.name = name;
      } else {
        state.categories.push({ id: uid(), name: name });
      }
      save(); closeSheet(); renderLib(); renderToday(); renderWProg();
      toast(editing ? "Saved" : "Added");
    };
    acts.appendChild(cancel); acts.appendChild(savB);
    body.appendChild(acts);

    if(editing){
      const count = state.exercises.filter(e => e.cat === cat.id).length;
      const del = el("button","btn danger wide","Delete category");
      del.style.marginTop = "10px";
      del.onclick = () => {
        if(count){ toast("Move or delete its " + count + " exercises first"); return; }
        if(!confirm("Delete this category?")) return;
        state.categories = state.categories.filter(c => c.id !== cat.id);
        save(); closeSheet(); renderLib(); renderToday(); renderWProg();
        toast("Deleted");
      };
      body.appendChild(del);
    }
    setTimeout(() => nameI.focus(), 60);
  }, start.color);
}

/* ============ day-feed progress (shared by workout + tasks) ============ */
function dayCard(dateStr, items, isDoneFn, onDayTap, colorOf){
  const isToday = dateStr === iso(new Date());
  const dt = parseISO(dateStr);
  const doneN = items.filter(it => isDoneFn(dateStr, it)).length;
  const card = el("section","cat pday" + (doneN === items.length ? " all" : ""));
  card.style.setProperty("--cc", isToday ? "var(--teal)" : "var(--rule)");

  const head = el(onDayTap ? "button" : "div", "pday-head");
  if(onDayTap){ head.type = "button"; head.onclick = () => onDayTap(dateStr); }
  const t = el("span","pday-title");
  t.appendChild(el("span","pday-name", DAY_FULL[dt.getDay()]));
  t.appendChild(el("span","pday-date", (isToday ? "Today, " : "") + fmtShort(dateStr)));
  head.appendChild(t);
  head.appendChild(el("span","pday-count", doneN + "/" + items.length));
  card.appendChild(head);

  const bar = el("div","segbar");
  bar.setAttribute("aria-hidden","true");
  items.forEach(it => {
    const i = el("i", isDoneFn(dateStr, it) ? "done" : "");
    i.style.setProperty("--cc", colorOf(it));
    bar.appendChild(i);
  });
  card.appendChild(bar);

  items.forEach(it => {
    const done = isDoneFn(dateStr, it);
    const row = el("div","dayitem" + (done ? " done" : ""));
    row.style.setProperty("--cc", colorOf(it));
    row.appendChild(el("span","dayitem-dot"));
    const nm = el("span","dayitem-name");
    bidi(nm, it.name);
    row.appendChild(nm);
    const mark = el("span","dayitem-mark");
    if(done) mark.innerHTML = CHECK_SVG;
    mark.setAttribute("role","img");
    mark.setAttribute("aria-label", done ? "Done" : "Not done");
    row.appendChild(mark);
    card.appendChild(row);
  });
  return card;
}
function renderDayFeed(wrap, getItemsForDate, isDoneFn, onDayTap, emptyMsg, colorOf){
  const todayStr = iso(new Date());
  let any = false;
  for(let i = 0; i < HISTORY_DAYS; i++){
    const d = addDays(todayStr, -i);
    const items = getItemsForDate(d);
    if(!items.length) continue;
    any = true;
    wrap.appendChild(dayCard(d, items, isDoneFn, onDayTap, colorOf));
  }
  if(!any) wrap.appendChild(el("div","empty-state", emptyMsg));
}

/* ============ WORKOUT PROGRESS ============ */
function renderWProg(){
  const wrap = document.getElementById("wprogBody");
  wrap.innerHTML = "";
  renderDayFeed(
    wrap,
    d => byCategoryOrder(scheduledOn(d)),
    (d, ex) => !!(state.log[d] && state.log[d][ex.id] && state.log[d][ex.id].done),
    d => { selectedDate = d; switchMode("workout"); switchView("today"); },
    state.exercises.length ? "Nothing logged yet. Finish a day and it shows up here." : "No exercises yet. Add some in Library.",
    ex => catStyle(catOfId(ex.cat)).color
  );
}

/* ============ TASKS ============ */
const TASK_COLOR = t => t.pinned ? "var(--c4)" : "var(--c5)";
let lastTask = null;

function renderTasks(){
  const wrap = document.getElementById("taskList");
  wrap.innerHTML = "";
  const today = iso(new Date());
  const pinned = state.tasks.filter(t => t.pinned && t.date <= today);
  const oneOff = state.tasks.filter(t => !t.pinned && t.date === today);
  const doneLog = state.taskLog[today] || {};
  const doneN = pinned.concat(oneOff).filter(t => doneLog[t.id] && doneLog[t.id].done).length;
  const total = pinned.length + oneOff.length;
  document.getElementById("taskSub").textContent = total ? doneN + " of " + total + " done today" : "Nothing on your list today";

  if(!total){
    const e = el("div","empty-state");
    e.appendChild(el("p", null, "No tasks yet. Pin one to repeat it daily, or add one just for today."));
    wrap.appendChild(e);
    lastTask = null;
    return;
  }

  const section = (list, title, color, icon) => {
    const d = list.filter(t => doneLog[t.id] && doneLog[t.id].done).length;
    const sec = catCard(color, icon, title, d + "/" + list.length);
    list.forEach(t => sec.appendChild(taskRow(t)));
    wrap.appendChild(sec);
  };
  if(pinned.length) section(pinned, "Every day", "var(--c4)", UI_ICONS.pin);
  if(oneOff.length) section(oneOff, "Just today", "var(--c5)", UI_ICONS.sun);
  lastTask = null;
}

function taskRow(t){
  const today = iso(new Date());
  const day = state.taskLog[today] || {};
  const entry = day[t.id] || {};
  const row = el("div","row" + (entry.done ? " done" : "") + (entry.done && t.id === lastTask ? " pop" : ""));
  row.setAttribute("role","button");
  row.tabIndex = 0;

  const box = el("div","box");
  box.innerHTML = CHECK_SVG;
  box.setAttribute("role","button");
  box.tabIndex = 0;
  const toggle = e => { e.stopPropagation(); toggleTask(t); };
  box.onclick = toggle;
  box.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(e); } };
  row.appendChild(box);

  const main = el("div","row-main");
  const name = el("div","row-name");
  bidi(name, t.name);
  main.appendChild(name);
  row.appendChild(main);

  const edit = el("span","cat-edit");
  edit.innerHTML = UI_ICONS.pencil;
  edit.setAttribute("aria-hidden","true");
  row.appendChild(edit);

  const openEdit = () => openTaskSheet(t);
  row.onclick = openEdit;
  row.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); openEdit(); } };
  return row;
}

function toggleTask(t){
  const today = iso(new Date());
  if(!state.taskLog[today]) state.taskLog[today] = {};
  const cur = state.taskLog[today][t.id] || { done:false };
  state.taskLog[today][t.id] = { done: !cur.done };
  lastTask = cur.done ? null : t.id;
  save(); renderTasks();
}

function openTaskSheet(t){
  const editing = !!t;
  const draft = editing
    ? JSON.parse(JSON.stringify(t))
    : { id: uid(), name:"", pinned:false, date: iso(new Date()) };
  const look = pinned => pinned ? { color:"var(--c4)", icon:UI_ICONS.pin } : { color:"var(--c5)", icon:UI_ICONS.sun };

  openSheet(body => {
    const head = sheetHead(body, editing ? "Edit task" : "New task", look(draft.pinned).icon);

    const nameI = textInput(draft.name, "Task name — English or العربية");
    body.appendChild(makeField("Name", nameI));

    const cl = el("div","checkline");
    const lb = document.createElement("label");
    lb.setAttribute("for","pincb");
    lb.textContent = "Repeat every day";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.className = "switch"; cb.checked = !!draft.pinned; cb.id = "pincb";
    cb.onchange = () => { const s = look(cb.checked); head.setLook(s.color, s.icon); };
    cl.appendChild(lb); cl.appendChild(cb);
    const clF = el("div","field"); clF.appendChild(cl);
    clF.appendChild(el("div","field-hint","Off means it's just for today."));
    body.appendChild(clF);

    const acts = el("div","sheet-actions");
    const cancel = el("button","btn ghost","Cancel");
    cancel.onclick = closeSheet;
    const savB = el("button","btn primary", editing ? "Save changes" : "Add task");
    savB.onclick = () => {
      const name = nameI.value.trim();
      if(!name){ toast("Give the task a name"); nameI.focus(); return; }
      const rec = { id: draft.id, name: name, pinned: cb.checked, date: draft.date };
      const idx = state.tasks.findIndex(x => x.id === rec.id);
      if(idx >= 0) state.tasks[idx] = rec; else state.tasks.push(rec);
      save(); closeSheet(); renderTasks();
      toast(editing ? "Saved" : "Added");
    };
    acts.appendChild(cancel); acts.appendChild(savB);
    body.appendChild(acts);

    if(editing){
      const del = el("button","btn danger wide","Delete task");
      del.style.marginTop = "10px";
      del.onclick = () => {
        if(!confirm("Delete this task? Its history is removed too.")) return;
        state.tasks = state.tasks.filter(x => x.id !== t.id);
        Object.keys(state.taskLog).forEach(d => { if(state.taskLog[d]) delete state.taskLog[d][t.id]; });
        save(); closeSheet(); renderTasks(); renderTProg();
        toast("Deleted");
      };
      body.appendChild(del);
    }
    setTimeout(() => nameI.focus(), 60);
  }, look(draft.pinned).color);
}

/* ============ TASK PROGRESS ============ */
function renderTProg(){
  const wrap = document.getElementById("tprogBody");
  wrap.innerHTML = "";
  renderDayFeed(
    wrap,
    d => tasksOn(d).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)),
    (d, t) => !!(state.taskLog[d] && state.taskLog[d][t.id] && state.taskLog[d][t.id].done),
    d => { if(d === iso(new Date())){ switchMode("tasks"); switchView("tasks"); } },
    state.tasks.length ? "Nothing logged yet." : "No tasks yet. Add one in Tasks.",
    TASK_COLOR
  );
}

/* ============ data sheet ============ */
function openDataSheet(){
  openSheet(body => {
    sheetHead(body, "Backup", UI_ICONS.data);
    const note = el("div","field-hint","Everything lives on this device only. Export a backup to move it to another device, or before clearing browser data.");
    note.style.margin = "0 0 18px";
    body.appendChild(note);

    const exp = el("button","btn wide primary","Export backup (.json)");
    exp.style.marginBottom = "10px";
    exp.onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "bodylog-" + iso(new Date()) + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast("Backup downloaded");
    };
    body.appendChild(exp);

    const impWrap = el("div");
    const imp = el("button","btn ghost wide","Import backup");
    const file = document.createElement("input");
    file.type = "file"; file.accept = "application/json,.json"; file.style.display = "none";
    file.onchange = () => {
      const f = file.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          if(!data || !data.categories) throw new Error("bad file");
          if(!confirm("Replace everything on this device with the backup?")) return;
          state = data;
          state.exercises = state.exercises || [];
          state.log = state.log || {};
          state.tasks = state.tasks || [];
          state.taskLog = state.taskLog || {};
          state.muscles = (state.muscles && state.muscles.length) ? state.muscles : DEFAULT_MUSCLES.slice();
          delete state.history;
          delete state.pbs;
          rollover(); save(); closeSheet();
          renderToday(); renderLib(); renderWProg(); renderTasks(); renderTProg();
          toast("Backup restored");
        } catch(e){ toast("That file isn't a Body Log backup"); }
      };
      r.readAsText(f);
    };
    imp.onclick = () => file.click();
    impWrap.appendChild(imp); impWrap.appendChild(file);
    impWrap.style.marginBottom = "10px";
    body.appendChild(impWrap);

    const wipe = el("button","btn danger wide","Erase everything");
    wipe.onclick = () => {
      if(!confirm("Erase all exercises, tasks and logs on this device?")) return;
      if(!confirm("Last chance — this cannot be undone.")) return;
      localStorage.removeItem(KEY);
      state = defaultState();
      selectedDate = iso(new Date());
      save(); closeSheet();
      renderToday(); renderLib(); renderWProg(); renderTasks(); renderTProg();
      toast("Erased");
    };
    body.appendChild(wipe);
  }, "var(--c1)");
}

/* ============ nav ============ */
function switchMode(m){
  mode = m;
  document.querySelectorAll(".mode").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  document.getElementById("tabs-workout").style.display = m === "workout" ? "grid" : "none";
  document.getElementById("tabs-tasks").style.display = m === "tasks" ? "grid" : "none";
  switchView(m === "workout" ? "today" : "tasks");
}
function switchView(v){
  document.querySelectorAll(".view").forEach(s => s.classList.remove("on"));
  document.getElementById("v-" + v).classList.add("on");
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === v));
  window.scrollTo(0, 0);
  if(v === "today") renderToday();
  if(v === "lib") renderLib();
  if(v === "wprog") renderWProg();
  if(v === "tasks") renderTasks();
  if(v === "tprog") renderTProg();
}
document.querySelectorAll(".mode").forEach(b => { b.onclick = () => switchMode(b.dataset.mode); });
document.querySelectorAll(".tab").forEach(t => { t.onclick = () => switchView(t.dataset.view); });
document.getElementById("addExBtn").onclick = () => openExSheet(null);
document.getElementById("addCatBtn").onclick = () => openCatSheet(null);
document.getElementById("addTaskBtn").onclick = () => openTaskSheet(null);
document.getElementById("dataBtn").onclick = openDataSheet;
document.getElementById("dataBtn2").onclick = openDataSheet;

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    const t = iso(new Date());
    rollover();
    if(!weekDates(state.weekStart).includes(selectedDate)) selectedDate = t;
    renderToday(); renderTasks(); renderWProg(); renderTProg();
  }
});

/* ============ boot ============ */
load();
if(!weekDates(state.weekStart).includes(selectedDate)) selectedDate = iso(new Date());
renderToday(); renderLib(); renderWProg(); renderTasks(); renderTProg();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
